spring:
  application.name: umkc-ai-commercialization-advisor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/advisor}
    username: ${DB_USER:advisor}
    password: ${DB_PASSWORD:}
  flyway.enabled: true
  servlet.multipart.max-file-size: 10MB
server:
  port: 8080
  error.include-message: never
advisor:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
    base-url: https://api.anthropic.com
    max-tokens: 1500
    timeout-seconds: 60
  referral:
    # Defaults come from the official UMKC pages. The project team must confirm them before real use.
    office-name: ${REFERRAL_OFFICE_NAME:UMKC Office of Technology Transfer}
    email: ${REFERRAL_EMAIL:techcomm@umkc.edu}
    url: ${REFERRAL_URL:https://ori.umkc.edu/facilities-compliance-and-commercialization/commercialization/process/submit-an-invention-disclosure.html}
  limits:
    max-question-chars: 2000
  rag:
    top-k: 6
    min-score: 0.30     # cosine similarity; tune with the Colab notebook
  admin-token: ${ADMIN_TOKEN:}   # empty = admin endpoints disabled
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
logging.level.edu.umkc.advisor: INFO
