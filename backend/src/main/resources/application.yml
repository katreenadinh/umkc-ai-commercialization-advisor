spring:
  application.name: umkc-ai-commercialization-advisor
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/advisor}
    username: ${DB_USER:advisor}
    password: ${DB_PASSWORD:}
  flyway.enabled: true
server:
  port: ${SERVER_PORT:8081}      # 8081 because mlx_lm.server defaults to 8080
  error.include-message: never
advisor:
  llm:
    provider: ${LLM_PROVIDER:local}       # local | hosted
    max-tokens: 1200
    timeout-seconds: 180                  # local inference on a laptop can be slow
    local:
      # CONFIRM against your running MLX server; these are placeholders, not verified values.
      base-url: ${LOCAL_LLM_BASE_URL:http://127.0.0.1:8080/v1}
      model: ${LOCAL_LLM_MODEL:CONFIGURE_MODEL_NAME}
    anthropic:                            # optional hosted provider; off by default
      api-key: ${LLM_API_KEY:${ANTHROPIC_API_KEY:}}
      model: ${LLM_MODEL:${ANTHROPIC_MODEL:}}
      base-url: ${LLM_BASE_URL:https://api.anthropic.com}
  referral:
    # First contact is Jeff at the Office of Commercialization. Do not use REFERRAL_* env
    # placeholders here: a leftover shell export of Eric's address would override .env.
    office-name: UMKC Office of Commercialization
    email: jblackwood@umkc.edu
    url: ${REFERRAL_URL:https://ori.umkc.edu/facilities-compliance-and-commercialization/commercialization/process/submit-an-invention-disclosure.php}
  limits:
    max-question-chars: 2000
    max-message-chars: 3000
    max-drafts-per-owner: 25
  rag:
    top-k: 8
    min-score: 0.25
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
logging.level.edu.umkc.advisor: INFO
